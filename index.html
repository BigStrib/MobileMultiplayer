<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>MultiPlayer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- TOP BAR -->
    <div id="topBar" class="top-bar">
        <h1>MultiPlayer</h1>
        <div class="top-actions">
            <button id="layoutBtn" class="icon-btn" type="button">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>
            </button>
            <button id="addBtn" class="icon-btn add-btn" type="button">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
        </div>
    </div>

    <!-- VIDEO GRID -->
    <div id="videoGrid" class="video-grid"></div>

    <!-- EMPTY STATE -->
    <div id="emptyState" class="empty-state">
        <div class="empty-icon">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        </div>
        <p>Tap <strong>+</strong> to add videos</p>
        <p class="sub">YouTube &bull; Twitch &bull; Rumble &bull; Kick</p>
    </div>

    <!-- BOTTOM CONTROLS -->
    <div id="controlsBar" class="controls-bar hidden">
        <button class="ctrl-btn" data-action="unmute" type="button">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            <span>Unmute</span>
        </button>
        <button class="ctrl-btn" data-action="move-left" type="button">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            <span>Move &larr;</span>
        </button>
        <button class="ctrl-btn" data-action="move-right" type="button">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            <span>Move &rarr;</span>
        </button>
        <button class="ctrl-btn" data-action="reload" type="button">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            <span>Reload</span>
        </button>
        <button class="ctrl-btn danger" data-action="remove" type="button">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            <span>Remove</span>
        </button>
    </div>

    <!-- ADD MODAL -->
    <div id="addModal" class="modal-wrap hidden">
        <div class="modal-bg"></div>
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <div class="modal-top">
                <h2>Add Video</h2>
                <button class="modal-close" id="closeAddModal" type="button">&times;</button>
            </div>
            <div class="modal-inner">
                <div class="input-row">
                    <input type="text" id="urlInput" placeholder="Paste video URL..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                    <button id="pasteBtn" class="paste-btn" type="button">Paste</button>
                </div>
                <div class="chips">
                    <span class="chip yt">YouTube</span>
                    <span class="chip tw">Twitch</span>
                    <span class="chip ru">Rumble</span>
                    <span class="chip ki">Kick</span>
                </div>
                <div class="examples">
                    <p>Supported URLs:</p>
                    <code>youtube.com/watch?v=xxxxx</code>
                    <code>youtu.be/xxxxx</code>
                    <code>twitch.tv/channelname</code>
                    <code>rumble.com/embed/xxxxx</code>
                    <code>kick.com/channelname</code>
                </div>
                <button id="submitVideo" class="submit-btn" type="button">Add Video</button>
            </div>
        </div>
    </div>

    <!-- LAYOUT MODAL -->
    <div id="layoutModal" class="modal-wrap hidden">
        <div class="modal-bg"></div>
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <div class="modal-top">
                <h2>Choose Layout</h2>
                <button class="modal-close" id="closeLayoutModal" type="button">&times;</button>
            </div>
            <div class="modal-inner">
                <div class="layout-grid">
                    <button class="lay-opt" data-layout="1" type="button">
                        <div class="lay-thumb t1"><div></div></div>
                        <span>Single</span>
                    </button>
                    <button class="lay-opt active" data-layout="2" type="button">
                        <div class="lay-thumb t2"><div></div><div></div></div>
                        <span>2 Col</span>
                    </button>
                    <button class="lay-opt" data-layout="3" type="button">
                        <div class="lay-thumb t3"><div></div><div></div><div></div></div>
                        <span>3 Col</span>
                    </button>
                    <button class="lay-opt" data-layout="2x1" type="button">
                        <div class="lay-thumb t2x1"><div class="wide"></div><div></div><div></div></div>
                        <span>Featured</span>
                    </button>
                    <button class="lay-opt" data-layout="pip" type="button">
                        <div class="lay-thumb tpip"><div class="bg"></div><div class="sm"></div></div>
                        <span>PiP</span>
                    </button>
                    <button class="lay-opt" data-layout="auto" type="button">
                        <div class="lay-thumb tauto"><div></div><div></div><div></div><div></div></div>
                        <span>Auto</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toastBox"></div>

    <script src="script.js"></script>
</body>
</html>
