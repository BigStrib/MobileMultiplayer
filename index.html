<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MultiView">
  <meta name="description" content="MultiView - Watch YouTube, Twitch, Kick, and Rumble streams in split view">
  
  <title>MultiView</title>
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <!-- Sidebar -->
  <div id="sidebar" class="sidebar">
    <div id="sidebar-content" class="sidebar-content">
      
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg class="logo-svg" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <polyline points="9 12 16 12"></polyline>
            <polyline points="9 9 16 9"></polyline>
            <polyline points="9 15 16 15"></polyline>
          </svg>
          <span class="logo-text">MultiView</span>
        </div>
      </div>
      
      <div class="sidebar-section">
        <label class="input-label">
          <svg class="input-icon" viewBox="0 0 24 24">
            <polyline points="12 2 19 8 19 20 5 20 5 8 12 2"></polyline>
          </svg>
          Stream URL
        </label>
        <input 
          id="urlInput" 
          type="text" 
          placeholder="youtube.com/watch?v=..."
          spellcheck="false"
        >
      </div>
      
      <button id="addBtn" class="btn-add">
        <svg viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add Stream
      </button>
      
      <div class="divider">or</div>
      
      <div class="sidebar-section">
        <label class="input-label">
          <svg class="input-icon" viewBox="0 0 24 24">
            <polyline points="10 6 4 12 10 18"></polyline>
            <polyline points="14 6 20 12 14 18"></polyline>
          </svg>
          Embed Code
        </label>
        <textarea id="embedInput" placeholder="Paste embed code..."></textarea>
      </div>
      
      <button id="addEmbedBtn" class="btn-add">
        <svg viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add Embed
      </button>
      
      <div class="platforms-section">
        <div class="platforms-title">Supported Platforms</div>
        <ul class="platforms-list">
          <li class="platform-item">
            <svg class="platform-icon icon-youtube" viewBox="0 0 24 24">
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            <span class="platform-name">YouTube</span>
          </li>
          <li class="platform-item">
            <svg class="platform-icon icon-twitch" viewBox="0 0 24 24">
              <path d="M11.571 4.714h1.429v4.286h-1.429V4.714zM15.571 4.714h1.429v4.286h-1.429V4.714zM6 0L1.714 4.286V21h5.143v2.857h2.857L12 21h2.857l4.286-4.286V0H6zm12.571 12.571l-2.857 2.857h-2.857l-2.857 2.857v-2.857H6.857V1.143h11.714v11.428z"/>
            </svg>
            <span class="platform-name">Twitch</span>
          </li>
          <li class="platform-item">
            <svg class="platform-icon icon-kick" viewBox="0 0 24 24">
              <path d="M7.5 3.5h9v5h-3.5v7h-5.5v-12zm0 9h3.5v5h-3.5v-5z"/>
            </svg>
            <span class="platform-name">Kick</span>
          </li>
          <li class="platform-item">
            <svg class="platform-icon icon-vimeo" viewBox="0 0 24 24">
              <path d="M23.834 5.987c-.048-1.674-1.242-2.962-2.919-2.962-1.667 0-2.875 1.23-3.58 2.475-.485-.855-1.41-2.475-3.407-2.475-1.998 0-3.408 1.23-4.134 2.475V3.025H6.81v13.92h2.98V10.41c0-.917.173-1.706.53-2.34.531-1.02 1.411-1.705 2.487-1.705 1.598 0 2.24 1.287 2.24 2.866v7.714h2.982v-7.48c0-2.31-1.294-4.078-3.407-4.078-1.294 0-2.34.59-2.923 1.588.108-.314.155-.706.155-1.159 0-1.157-.486-2.034-1.41-2.034-.94 0-1.584.877-1.584 2.034v.971H.5V3.025h2.982v2.923c.728-1.245 2.036-2.923 4.28-2.923 1.925 0 3.283.933 4.026 2.312.627-1.456 2.107-2.312 3.68-2.312 1.785 0 2.979 1.128 3.052 2.952h-3.153c-.024-.591-.468-.997-1.053-.997-.627 0-1.053.406-1.053.997h2.982z"/>
            </svg>
            <span class="platform-name">Rumble</span>
          </li>
        </ul>
      </div>
      
    </div>
  </div>
  
  <!-- Sidebar Backdrop -->
  <div class="sidebar-backdrop" id="backdrop"></div>
  
  <!-- Sidebar Toggle Tab -->
  <button id="sidebar-tab" class="sidebar-tab">
    <svg class="tab-svg" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
    </svg>
  </button>
  
  <!-- Main Workspace -->
  <div id="workspace" class="workspace">
    <div id="welcome" class="welcome">
      <div id="welcome-inner" class="welcome-inner">
        <div class="welcome-logo">
          <svg class="welcome-logo-svg" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <polyline points="9 12 16 12"></polyline>
            <polyline points="9 9 16 9"></polyline>
            <polyline points="9 15 16 15"></polyline>
          </svg>
          <span style="font-size: 2rem; font-weight: 700; color: #e50914;">MultiView</span>
        </div>
        <h1 class="welcome-title">MultiView</h1>
        <p class="welcome-tagline">Watch multiple streams at once</p>
        
        <div class="welcome-platforms">
          <div class="welcome-platform">
            <svg viewBox="0 0 24 24">
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
          </div>
          <div class="welcome-platform">
            <svg viewBox="0 0 24 24">
              <path d="M11.571 4.714h1.429v4.286h-1.429V4.714zM15.571 4.714h1.429v4.286h-1.429V4.714zM6 0L1.714 4.286V21h5.143v2.857h2.857L12 21h2.857l4.286-4.286V0H6zm12.571 12.571l-2.857 2.857h-2.857l-2.857 2.857v-2.857H6.857V1.143h11.714v11.428z"/>
            </svg>
          </div>
          <div class="welcome-platform">
            <svg viewBox="0 0 24 24">
              <path d="M7.5 3.5h9v5h-3.5v7h-5.5v-12zm0 9h3.5v5h-3.5v-5z"/>
            </svg>
          </div>
          <div class="welcome-platform">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"/>
              <path d="M3 12h18M12 3v18" stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
          </div>
        </div>
        
        <div class="welcome-instructions">
          <div class="instruction-item">
            <svg viewBox="0 0 24 24">
              <polyline points="12 5 19 12 12 19"></polyline>
              <polyline points="7 12 19 12"></polyline>
            </svg>
            Paste a stream URL
          </div>
          <div class="instruction-item">
            <svg viewBox="0 0 24 24">
              <polyline points="12 5 19 12 12 19"></polyline>
              <polyline points="7 12 19 12"></polyline>
            </svg>
            Click "Add Stream"
          </div>
          <div class="instruction-item">
            <svg viewBox="0 0 24 24">
              <polyline points="12 5 19 12 12 19"></polyline>
              <polyline points="7 12 19 12"></polyline>
            </svg>
            Drag to move, resize corners
          </div>
        </div>
        
        <p class="welcome-shortcut">Press <kbd>Shift</kbd> to open sidebar</p>
      </div>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
