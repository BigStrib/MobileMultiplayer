<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>MultiPlayer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Top Bar - hidden during viewing -->
        <header id="topBar" class="top-bar">
            <h1>MultiPlayer</h1>
            <div class="top-actions">
                <button id="layoutBtn" class="icon-btn" title="Layout">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>
                </button>
                <button id="addBtn" class="icon-btn add-btn" title="Add Video">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                </button>
            </div>
        </header>

        <!-- Video Grid -->
        <main id="videoGrid" class="video-grid" data-layout="2">
        </main>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state">
            <div class="empty-icon">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <p>Tap <strong>+</strong> to add videos</p>
            <p class="sub">YouTube • Twitch • Rumble • Kick</p>
        </div>

        <!-- Add Video Modal -->
        <div id="addModal" class="modal hidden">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Add Video</h2>
                    <button id="closeModal" class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="input-group">
                        <input type="text" id="urlInput" placeholder="Paste video URL or channel name..." autocomplete="off" autocorrect="off" autocapitalize="off">
                        <button id="pasteBtn" class="paste-btn">Paste</button>
                    </div>
                    <div class="platform-hints">
                        <span class="hint yt">YouTube</span>
                        <span class="hint tw">Twitch</span>
                        <span class="hint ru">Rumble</span>
                        <span class="hint ki">Kick</span>
                    </div>
                    <div class="url-examples">
                        <p>Examples:</p>
                        <small>youtube.com/watch?v=xxxxx</small>
                        <small>youtu.be/xxxxx</small>
                        <small>twitch.tv/channelname</small>
                        <small>rumble.com/embed/xxxxx</small>
                        <small>kick.com/channelname</small>
                    </div>
                    <button id="addVideoBtn" class="primary-btn">Add Video</button>
                </div>
            </div>
        </div>

        <!-- Layout Modal -->
        <div id="layoutModal" class="modal hidden">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Layout</h2>
                    <button id="closeLayoutModal" class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="layout-options">
                        <button class="layout-option" data-layout="1">
                            <div class="layout-preview l1"><div></div></div>
                            <span>Single</span>
                        </button>
                        <button class="layout-option active" data-layout="2">
                            <div class="layout-preview l2"><div></div><div></div></div>
                            <span>2 Column</span>
                        </button>
                        <button class="layout-option" data-layout="3">
                            <div class="layout-preview l3"><div></div><div></div><div></div></div>
                            <span>3 Column</span>
                        </button>
                        <button class="layout-option" data-layout="2x1">
                            <div class="layout-preview l2x1"><div class="big"></div><div></div></div>
                            <span>Featured</span>
                        </button>
                        <button class="layout-option" data-layout="pip">
                            <div class="layout-preview lpip"><div class="main"></div><div class="pip"></div></div>
                            <span>PiP</span>
                        </button>
                        <button class="layout-option" data-layout="auto">
                            <div class="layout-preview lauto"><div></div><div></div><div></div><div></div></div>
                            <span>Auto</span>
                        </button>
                    </div>
                    <div class="fill-mode-toggle">
                        <label>Fill mode (crop to remove black bars)</label>
                        <div class="toggle-switch">
                            <input type="checkbox" id="fillToggle" checked>
                            <label for="fillToggle" class="toggle-label"></label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Video Controls Overlay (per video) -->
        <div id="controlsOverlay" class="controls-overlay hidden">
            <div class="control-actions">
                <button class="ctrl-btn" data-action="mute">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
                <button class="ctrl-btn" data-action="move-up">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
                </button>
                <button class="ctrl-btn" data-action="move-down">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
                </button>
                <button class="ctrl-btn" data-action="reload">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                </button>
                <button class="ctrl-btn danger" data-action="remove">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </button>
            </div>
        </div>

        <!-- Tap indicator -->
        <div id="tapHint" class="tap-hint hidden">
            <p>Tap any video for controls</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
