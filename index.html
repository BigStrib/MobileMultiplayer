<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mobile Multiplayer (POC)</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Pure video grid -->
  <main id="grid" aria-label="Video grid"></main>

  <!-- Corner settings button -->
  <button id="fab" class="fab" aria-label="Open settings">
    <!-- gear -->
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path fill="currentColor" d="M19.14,12.94c0.04-0.31,0.06-0.63,0.06-0.94s-0.02-0.63-0.06-0.94l2.03-1.58
      c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.11-0.2-0.36-0.28-0.57-0.2l-2.39,0.96c-0.5-0.38-1.04-0.69-1.64-0.92
      L14.4,2.81C14.37,2.59,14.18,2.43,13.95,2.43h-3.9c-0.23,0-0.42,0.16-0.45,0.38L9.23,5.39
      C8.63,5.62,8.09,5.93,7.59,6.31L5.2,5.35c-0.21-0.08-0.46,0-0.57,0.2L2.71,8.87C2.6,9.07,2.65,9.34,2.83,9.48
      l2.03,1.58C4.82,11.37,4.8,11.69,4.8,12s0.02,0.63,0.06,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32
      c0.11,0.2,0.36,0.28,0.57,0.2l2.39-0.96c0.5,0.38,1.04,0.69,1.64,0.92l0.37,2.58c0.03,0.22,0.22,0.38,0.45,0.38h3.9
      c0.23,0,0.42-0.16,0.45-0.38l0.37-2.58c0.6-0.23,1.14-0.54,1.64-0.92l2.39,0.96c0.21,0.08,0.46,0,0.57-0.2l1.92-3.32
      c0.11-0.2,0.06-0.47-0.12-0.61L19.14,12.94z M12,15.3c-1.82,0-3.3-1.48-3.3-3.3s1.48-3.3,3.3-3.3s3.3,1.48,3.3,3.3
      S13.82,15.3,12,15.3z"/>
    </svg>
  </button>

  <!-- Settings bottom sheet -->
  <section id="sheet" class="sheet" aria-label="Settings">
    <div id="sheetHandle" class="sheet__handle" aria-hidden="true"></div>

    <div class="sheet__card">
      <div class="sheet__row sheet__row--top">
        <button id="enterEditBtn" class="icon" aria-label="Enter edit mode">
          <!-- pencil -->
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm2.92 2.33H5v-.92l8.06-8.06.92.92L5.92 19.58zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
          </svg>
        </button>

        <button id="closeSheetBtn" class="icon" aria-label="Close settings">
          <!-- chevron down -->
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M7.41 8.59a1 1 0 0 1 1.41 0L12 11.76l3.18-3.17a1 1 0 1 1 1.41 1.41l-3.88 3.88a1 1 0 0 1-1.41 0L7.41 10a1 1 0 0 1 0-1.41z"/>
          </svg>
        </button>
      </div>

      <div class="sheet__row">
        <div class="segmented" role="group" aria-label="Videos per row">
          <button class="segmented__btn" data-cols="1" aria-label="1 per row">1</button>
          <button class="segmented__btn" data-cols="2" aria-label="2 per row">2</button>
          <button class="segmented__btn" data-cols="3" aria-label="3 per row">3</button>
        </div>
      </div>

      <div class="sheet__row">
        <input id="urlInput" class="input" placeholder="Paste stream URL…" autocomplete="off" />
        <button id="addBtn" class="icon icon--primary" aria-label="Add stream">
          <!-- plus -->
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M19 11h-6V5a1 1 0 0 0-2 0v6H5a1 1 0 0 0 0 2h6v6a1 1 0 0 0 2 0v-6h6a1 1 0 0 0 0-2z"/>
          </svg>
        </button>
      </div>
    </div>
  </section>

  <!-- Edit dock (only shows in edit mode) -->
  <nav id="dock" class="dock" aria-label="Edit actions">
    <button id="volumeBtn" class="dock__btn" aria-label="Toggle audio for selected" disabled>
      <span id="volumeIcon" aria-hidden="true"></span>
    </button>

    <button id="moveBtn" class="dock__btn" aria-label="Toggle move/reorder mode" disabled>
      <!-- move -->
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="currentColor" d="M12 2l3 3h-2v4h4V7l3 3-3 3v-2h-4v4h2l-3 3-3-3h2v-4H7v2l-3-3 3-3v2h4V5H9l3-3z"/>
      </svg>
    </button>

    <button id="trashBtn" class="dock__btn dock__btn--danger" aria-label="Remove selected" disabled>
      <!-- trash -->
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="currentColor" d="M9 3a1 1 0 0 0-1 1v1H5a1 1 0 0 0 0 2h1v14a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7h1a1 1 0 0 0 0-2h-3V4a1 1 0 0 0-1-1H9zm1 2h4v0H10v0zm-1 4a1 1 0 0 1 1 1v9a1 1 0 0 1-2 0v-9a1 1 0 0 1 1-1zm6 0a1 1 0 0 1 1 1v9a1 1 0 0 1-2 0v-9a1 1 0 0 1 1-1z"/>
      </svg>
    </button>

    <button id="doneBtn" class="dock__btn dock__btn--primary" aria-label="Done">
      <!-- check -->
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="currentColor" d="M9 16.17 4.83 12a1 1 0 0 0-1.41 1.41l4.88 4.88a1 1 0 0 0 1.41 0l10-10a1 1 0 1 0-1.41-1.41L9 16.17z"/>
      </svg>
    </button>
  </nav>

  <script src="./script.js"></script>
</body>
</html>
