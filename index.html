<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>StreamSync</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main Video Grid Container -->
    <div class="viewport" id="viewport">
        <div class="grid-container" id="gridContainer">
            <!-- Stream tiles generated by JavaScript -->
        </div>
    </div>

    <!-- Bottom Sheet / Control Panel -->
    <div class="sheet-overlay" id="sheetOverlay"></div>
    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-handle"></div>
        
        <div class="sheet-content">
            <!-- Tab Navigation -->
            <div class="sheet-tabs">
                <button class="sheet-tab active" data-tab="add" aria-label="Add stream">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    <span>Add</span>
                </button>
                <button class="sheet-tab" data-tab="manage" aria-label="Manage streams">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    <span>Manage</span>
                </button>
            </div>

            <!-- Add Stream Tab -->
            <div class="sheet-tab-content active" data-tab-content="add">
                <div class="input-section">
                    <label class="input-label">Paste Stream URL</label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            class="stream-url-input" 
                            id="streamUrlInput" 
                            placeholder="youtube.com/watch?v=..."
                            autocomplete="off"
                            spellcheck="false"
                        >
                        <button class="input-clear-btn" id="inputClearBtn" aria-label="Clear input">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <line x1="18" y1="6" x2="6" y2="18"/>
                                <line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </button>
                    </div>
                    <div class="platform-hints">
                        <span class="hint-badge">YouTube</span>
                        <span class="hint-badge">Twitch</span>
                        <span class="hint-badge">Kick</span>
                        <span class="hint-badge">Rumble</span>
                    </div>
                </div>

                <button class="btn btn-primary btn-large" id="addStreamBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Add Stream
                </button>

                <div class="divider"></div>

                <div class="info-section">
                    <h3 class="info-title">Supported Platforms</h3>
                    <div class="platforms-grid">
                        <div class="platform-card">
                            <div class="platform-icon">▶</div>
                            <div class="platform-name">YouTube</div>
                        </div>
                        <div class="platform-card">
                            <div class="platform-icon">🎮</div>
                            <div class="platform-name">Twitch</div>
                        </div>
                        <div class="platform-card">
                            <div class="platform-icon">🚀</div>
                            <div class="platform-name">Kick</div>
                        </div>
                        <div class="platform-card">
                            <div class="platform-icon">🎬</div>
                            <div class="platform-name">Rumble</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Manage Streams Tab -->
            <div class="sheet-tab-content" data-tab-content="manage">
                <div class="streams-header">
                    <h3 class="streams-title">Active Streams</h3>
                    <span class="stream-count" id="streamCount">0/4</span>
                </div>

                <div class="streams-container" id="streamsContainer">
                    <!-- Stream items generated by JavaScript -->
                </div>

                <button class="btn btn-secondary btn-large" id="clearAllBtn" style="display: none;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                    Clear All
                </button>
            </div>
        </div>
    </div>

    <!-- Floating Action Button -->
    <button class="fab" id="fab" aria-label="Open controls">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="12" r="2"/>
            <circle cx="12" cy="5" r="2"/>
            <circle cx="12" cy="19" r="2"/>
        </svg>
    </button>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
